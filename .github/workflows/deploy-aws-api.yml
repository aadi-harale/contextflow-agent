name: Deploy Strands API to AWS

on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: AWS region containing the ContextFlow bootstrap stack
        required: true
        default: ap-south-1
      strands_model_id:
        description: Bedrock model/inference profile used by Strands
        required: true
        default: global.anthropic.claude-sonnet-4-6

permissions:
  id-token: write
  contents: read

concurrency:
  group: contextflow-aws-api
  cancel-in-progress: false

env:
  ECR_REPOSITORY: contextflow-agent-api
  LAMBDA_FUNCTION: contextflow-agent-api
  LAMBDA_EXECUTION_ROLE_NAME: ContextFlowLambdaExecutionRole

jobs:
  deploy:
    name: Build, deploy, and live-test Strands API
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ inputs.aws_region }}
      STRANDS_MODEL_ID: ${{ inputs.strands_model_id }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}

    steps:
      - name: Validate one-time AWS setup
        run: |
          if [ -z "$AWS_DEPLOY_ROLE_ARN" ]; then
            echo "::error::Missing repository variable AWS_DEPLOY_ROLE_ARN. Deploy infra/aws/bootstrap.yml in AWS first, then add the stack output GitHubDeployRoleArn as that GitHub Actions repository variable."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: ContextFlowGitHubDeploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve AWS resources
        id: aws
        shell: bash
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          IMAGE_URI="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY"
          EXECUTION_ROLE_ARN="arn:aws:iam::$ACCOUNT_ID:role/$LAMBDA_EXECUTION_ROLE_NAME"
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"
          echo "execution_role_arn=$EXECUTION_ROLE_ARN" >> "$GITHUB_OUTPUT"

      - name: Sign in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Lambda container
        shell: bash
        run: |
          docker build \
            -f apps/api/Dockerfile.lambda \
            -t "${{ steps.aws.outputs.image_uri }}:$GITHUB_SHA" \
            apps/api

      - name: Push Lambda container
        shell: bash
        run: |
          docker push "${{ steps.aws.outputs.image_uri }}:$GITHUB_SHA"

      - name: Create or update Lambda
        shell: bash
        run: |
          IMAGE="${{ steps.aws.outputs.image_uri }}:$GITHUB_SHA"
          EXECUTION_ROLE="${{ steps.aws.outputs.execution_role_arn }}"

          if aws lambda get-function --function-name "$LAMBDA_FUNCTION" >/dev/null 2>&1; then
            aws lambda update-function-code \
              --function-name "$LAMBDA_FUNCTION" \
              --image-uri "$IMAGE" >/dev/null
            aws lambda wait function-updated --function-name "$LAMBDA_FUNCTION"

            aws lambda update-function-configuration \
              --function-name "$LAMBDA_FUNCTION" \
              --timeout 120 \
              --memory-size 1536 \
              --environment "Variables={STRANDS_MODEL_ID=$STRANDS_MODEL_ID}" >/dev/null
            aws lambda wait function-updated --function-name "$LAMBDA_FUNCTION"
          else
            aws lambda create-function \
              --function-name "$LAMBDA_FUNCTION" \
              --package-type Image \
              --code "ImageUri=$IMAGE" \
              --role "$EXECUTION_ROLE" \
              --architectures x86_64 \
              --timeout 120 \
              --memory-size 1536 \
              --environment "Variables={STRANDS_MODEL_ID=$STRANDS_MODEL_ID}" >/dev/null
            aws lambda wait function-active-v2 --function-name "$LAMBDA_FUNCTION"
          fi

      - name: Ensure public Lambda Function URL
        id: endpoint
        shell: bash
        run: |
          if FUNCTION_URL="$(aws lambda get-function-url-config --function-name "$LAMBDA_FUNCTION" --query FunctionUrl --output text 2>/dev/null)"; then
            :
          else
            FUNCTION_URL="$(aws lambda create-function-url-config --function-name "$LAMBDA_FUNCTION" --auth-type NONE --query FunctionUrl --output text)"
          fi

          # Recreate the two public URL policy statements required for new Function URLs.
          aws lambda remove-permission --function-name "$LAMBDA_FUNCTION" --statement-id FunctionURLAllowPublicAccess >/dev/null 2>&1 || true
          aws lambda remove-permission --function-name "$LAMBDA_FUNCTION" --statement-id FunctionURLInvokeAllowPublicAccess >/dev/null 2>&1 || true

          aws lambda add-permission \
            --function-name "$LAMBDA_FUNCTION" \
            --statement-id FunctionURLAllowPublicAccess \
            --action lambda:InvokeFunctionUrl \
            --principal '*' \
            --function-url-auth-type NONE >/dev/null

          aws lambda add-permission \
            --function-name "$LAMBDA_FUNCTION" \
            --statement-id FunctionURLInvokeAllowPublicAccess \
            --action lambda:InvokeFunction \
            --principal '*' \
            --invoked-via-function-url >/dev/null

          echo "function_url=$FUNCTION_URL" >> "$GITHUB_OUTPUT"
          echo "### ContextFlow AWS deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Region: \`$AWS_REGION\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Model: \`$STRANDS_MODEL_ID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- API URL: \`$FUNCTION_URL\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Vercel env: \`CONTEXTFLOW_AGENT_API_URL=$FUNCTION_URL\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Health check deployed API
        shell: bash
        run: |
          BASE_URL="${{ steps.endpoint.outputs.function_url }}"
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error --max-time 15 "${BASE_URL}health" | tee /tmp/health.json; then
              echo
              exit 0
            fi
            echo "Function URL not ready yet (attempt $attempt/15); retrying..."
            sleep 4
          done
          echo "::error::Deployed Lambda Function URL did not pass /health."
          exit 1

      - name: Live Strands + Bedrock smoke test
        shell: bash
        run: |
          BASE_URL="${{ steps.endpoint.outputs.function_url }}"
          HTTP_CODE="$(curl --silent --show-error --max-time 110 \
            -o /tmp/agent-response.json \
            -w '%{http_code}' \
            -X POST "${BASE_URL}agent/run" \
            -H 'Content-Type: application/json' \
            -d '{"instruction":"Process claim CF-1842. Inspect the sanitized evidence, evaluate reimbursement policy, and return the safe plan using opaque secret references only. Do not verify completion because the browser has not executed yet."}')"

          cat /tmp/agent-response.json
          echo
          if [[ "$HTTP_CODE" != 2* ]]; then
            echo "::error::Live Strands/Bedrock test failed with HTTP $HTTP_CODE. Check Bedrock model access and the Lambda execution role."
            exit 1
          fi

      - name: Deployment complete
        shell: bash
        run: |
          echo "ContextFlow Strands API is live at: ${{ steps.endpoint.outputs.function_url }}"
