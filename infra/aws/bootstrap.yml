AWSTemplateFormatVersion: '2010-09-09'
Description: ContextFlow AWS bootstrap - GitHub OIDC deploy role, ECR repo, and Lambda execution role.

Parameters:
  ExistingGitHubOidcProviderArn:
    Type: String
    Default: ''
    Description: Leave blank unless token.actions.githubusercontent.com already exists in IAM. If it exists, paste its ARN here.

Conditions:
  CreateGitHubOidcProvider: !Equals [!Ref ExistingGitHubOidcProviderArn, '']

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateGitHubOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - Key: Project
          Value: ContextFlow

  ContextFlowApiRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: contextflow-agent-api
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: MUTABLE
      EncryptionConfiguration:
        EncryptionType: AES256
      RepositoryPolicyText:
        Version: '2012-10-17'
        Statement:
          - Sid: LambdaImageRetrieval
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  ContextFlowLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ContextFlowLambdaExecutionRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ContextFlowBedrockInvoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: '*'

  ContextFlowGitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ContextFlowGitHubDeployRole
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateGitHubOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - repo:aadi-harale/contextflow-agent:ref:refs/heads/main
                  - repo:aadi-harale@152193056/contextflow-agent@1369952235:ref:refs/heads/main
      Policies:
        - PolicyName: ContextFlowGitHubDeploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: EcrAuth
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: PushContextFlowImage
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                Resource: !GetAtt ContextFlowApiRepository.Arn
              - Sid: ManageContextFlowLambda
                Effect: Allow
                Action:
                  - lambda:GetFunction
                  - lambda:CreateFunction
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:GetFunctionConfiguration
                  - lambda:GetFunctionUrlConfig
                  - lambda:CreateFunctionUrlConfig
                  - lambda:UpdateFunctionUrlConfig
                  - lambda:AddPermission
                  - lambda:RemovePermission
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:contextflow-agent-api
              - Sid: PassExecutionRole
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !GetAtt ContextFlowLambdaExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com

Outputs:
  GitHubDeployRoleArn:
    Description: Add this value to the GitHub repository variable AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt ContextFlowGitHubDeployRole.Arn
  LambdaExecutionRoleArn:
    Value: !GetAtt ContextFlowLambdaExecutionRole.Arn
  EcrRepositoryUri:
    Value: !GetAtt ContextFlowApiRepository.RepositoryUri
  Region:
    Value: !Ref AWS::Region
